<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>찬찬특공개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fbfaf3;font-family:'Gaegu',sans-serif;color:#111;touch-action:none}
canvas{display:block;position:fixed;inset:0}
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(251,250,243,.82);z-index:10;padding:16px;overflow-y:auto}
.overlay.show{display:flex}
.logo{font-size:68px;font-weight:700;color:#ffe24a;letter-spacing:2px;transform:rotate(-3deg);text-align:center;line-height:1;
  text-shadow:3px 3px 0 #111,-3px 3px 0 #111,3px -3px 0 #111,-3px -3px 0 #111,0 3px 0 #111,0 -3px 0 #111,3px 0 0 #111,-3px 0 0 #111,6px 7px 0 #111}
.logo.small{font-size:52px}
.sub{font-size:24px;text-align:center;line-height:1.2}
.hint{font-size:19px;color:#555;text-align:center}
.btn{font-family:inherit;font-size:30px;font-weight:700;padding:6px 34px;background:#ffe24a;border:4px solid #111;border-radius:16px 10px 18px 9px/10px 18px 9px 16px;box-shadow:4px 5px 0 #111;cursor:pointer;color:#111;min-width:200px}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 #111}
.btn.gray{background:#e4e1d6;font-size:24px}
.btn:disabled{opacity:.5}
#pauseBtn{position:fixed;top:36px;left:12px;z-index:5;min-width:0;width:42px;height:42px;padding:0;font-size:22px;display:none;border-radius:10px 8px 12px 7px;box-shadow:2px 3px 0 #111}
#titleDog,#endDog{width:170px;height:auto;animation:bob .7s ease-in-out infinite alternate}
#endDog.lose{animation:none;transform:rotate(180deg);filter:grayscale(.4)}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12px) rotate(4deg)}}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px;max-width:760px;width:100%}
.card{width:210px;background:#fff;border:4px solid #111;border-radius:18px 12px 20px 10px/12px 20px 10px 18px;padding:14px 12px;text-align:center;cursor:pointer;transform:rotate(var(--r));box-shadow:5px 6px 0 #111;transition:transform .1s;pointer-events:none}
.cards.ready .card{pointer-events:auto}
.card:hover{transform:rotate(0) scale(1.04)}
.card img{width:72px;height:72px}
.card .nm{font-size:27px;font-weight:700;line-height:1.1}
.card .tag{display:inline-block;font-size:18px;font-weight:700;padding:0 8px;border:3px solid #111;border-radius:8px 5px 9px 4px;background:#ffe24a;margin:4px 0}
.card .tag.evo{background:#ff8ae6}
.card .tag.new{background:#8fdcff}
.card .ds{font-size:20px;line-height:1.1}
.stats{font-size:26px;text-align:center;line-height:1.35}
@media(max-width:640px){
  .logo{font-size:52px}.logo.small{font-size:42px}
  .cards{flex-direction:column;align-items:center;gap:12px}
  .card{width:100%;max-width:400px;display:grid;grid-template-columns:64px 1fr;text-align:left;column-gap:12px;padding:8px 12px}
  .card img{grid-row:span 3;width:60px;height:60px;align-self:center}
}
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:320px;margin-top:16px}
.lobby-btn{font-family:inherit;font-size:24px;font-weight:700;padding:18px 8px;background:#fff;border:4px solid #111;border-radius:16px 10px 18px 9px/10px 18px 9px 16px;box-shadow:4px 5px 0 #111;cursor:pointer;color:#111;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .05s}
.lobby-btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 #111}
.lobby-btn .lbi{font-size:34px;line-height:1}
.lobby-btn.equip-btn{background:#ffeaa7;border-color:#e17055;box-shadow:4px 5px 0 #e17055;font-size:28px;padding:22px 8px}
.lobby-btn.equip-btn .lbi{font-size:40px}
.lobby-btn.battle{background:#ff6b6b;color:#fff}
.lobby-btn.soon{opacity:.55}
.subpage{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;background:rgba(251,250,243,.97);z-index:12;padding:20px 16px;gap:12px}
.subpage.show{display:flex}
.back-link{font-family:inherit;font-size:22px;font-weight:700;background:none;border:none;cursor:pointer;color:#111;padding:4px 0;align-self:flex-start}
.back-link:active{opacity:.5}
.coming{font-size:28px;color:#999;margin:auto 0}
.battle-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1}
.battle-content{display:flex;flex:1;width:100%;gap:0;overflow:hidden}
.stage-map-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stage-map-wrap::-webkit-scrollbar{display:none}
.stage-map{position:relative;width:1300px;min-height:660px;height:100%}
.stage-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;width:88px;padding:5px 4px;border:4px solid #111;border-radius:14px 10px 16px 8px/10px 16px 8px 14px;box-shadow:3px 4px 0 #111;cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s;z-index:1;font-family:inherit;font-weight:700;color:#111;text-align:center;background:#fff}
.stage-node .st-num{font-size:10px;color:#666;letter-spacing:.5px}
.stage-node .st-icon{font-size:26px;line-height:1.1}
.stage-node .st-name{font-size:12px;line-height:1.1}
.stage-node .st-lv{font-size:10px;color:#888;font-weight:400}
.stage-node .st-check{position:absolute;top:-10px;right:-10px;width:22px;height:22px;background:#4a8c2a;color:#fff;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #111;z-index:2}
.stage-node.locked{opacity:.35;cursor:default}
.stage-node.cleared{border-color:#4a8c2a}
.stage-node.current{border-color:#c0392b;box-shadow:3px 4px 0 #a33,0 0 0 4px rgba(255,80,80,.25)}
.stage-node:active:not(.locked){transform:translate(-50%,-50%) scale(.92)}
.stage-dog{position:absolute;transition:left .6s ease-in-out,top .6s ease-in-out;pointer-events:none;transform:translate(-50%,-100%) scaleX(var(--dog-dir,1));z-index:3;animation:bob .7s ease-in-out infinite alternate}
.stage-info{width:38%;min-width:320px;max-width:500px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border-left:4px solid #ddd;overflow-y:auto}
.si-num{font-size:18px;color:#888;letter-spacing:2px}
.si-icon{font-size:80px;line-height:1.1}
.si-name{font-size:36px;font-weight:700;line-height:1.1}
.si-lv{font-size:22px;color:#666}
.si-stars{font-size:28px;letter-spacing:4px}
.si-start{width:100%;max-width:300px;font-size:28px;padding:16px 0}
.si-nav{display:flex;gap:14px;justify-content:center}
.equip-title{font-size:22px;font-weight:700;margin:10px 0 6px;text-align:center}
.equip-slots{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.equip-slot{width:80px;height:80px;border:4px solid #111;border-radius:16px 10px 18px 9px/10px 18px 9px 16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:3px 4px 0 #111;cursor:pointer;font-size:32px}
.equip-slot:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #111}
.equip-slot.empty{background:#f0ede4;border-style:dashed;font-size:22px;color:#bbb}
.equip-slot .eq-name{font-size:10px;color:#666;line-height:1;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,74px);gap:10px;justify-content:center;width:100%;padding:8px 0}
.inv-item{width:74px;height:74px;border:3px solid #111;border-radius:14px 10px 16px 8px/10px 16px 8px 14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:2px 3px 0 #111;cursor:pointer;font-size:26px}
.inv-item:active{transform:translate(2px,3px);box-shadow:0 0 0 #111}
.inv-item .eq-nm{font-size:10px;color:#666;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-item .eq-desc{font-size:9px;color:#999}
.equip-empty{font-size:20px;color:#999;text-align:center;margin:24px 0;line-height:1.5}
.mode-grid{display:flex;gap:16px;margin-top:20px;width:100%;max-width:400px;justify-content:center}
.mode-card{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;background:#fff;border:4px solid #111;border-radius:18px 12px 20px 10px/12px 20px 10px 18px;box-shadow:4px 5px 0 #111;cursor:pointer;flex:1;transition:transform .05s}
.mode-card:active{transform:translate(3px,4px);box-shadow:1px 1px 0 #111}
.mode-card.infinite{background:#1a1a2e;color:#fff}
.mode-card .mode-icon{font-size:48px;line-height:1}
.mode-card .mode-name{font-size:26px;font-weight:700}
.mode-card .mode-desc{font-size:15px;color:#888;line-height:1.2}
.mode-card.infinite .mode-desc{color:#aaa}
.shop-tabs{display:flex;gap:0;width:100%;max-width:500px;border-bottom:4px solid #111}
.shop-tab{flex:1;font-family:inherit;font-size:16px;font-weight:700;padding:10px 2px;background:#e4e1d6;border:none;cursor:pointer;color:#999;border-radius:12px 12px 0 0;transition:background .15s}
.shop-tab.active{background:#fff;color:#111;border:4px solid #111;border-bottom:4px solid #fff;margin-bottom:-4px;position:relative;z-index:1}
.shop-tab.locked{opacity:.45;cursor:default}
.shop-content{width:100%;max-width:500px;overflow-y:auto;flex:1;padding:12px 0}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,140px);gap:14px;justify-content:center;width:100%}
.skin-card{border:4px solid #111;border-radius:16px 10px 18px 9px/10px 18px 9px 16px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:3px 4px 0 #111;cursor:pointer}
.skin-card:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #111}
.skin-card.selected{border-color:#e74c3c;box-shadow:3px 4px 0 #c0392b}
.skin-card img{width:100px;height:100px;object-fit:contain;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/16px 16px;border-radius:8px}
.skin-card .sk-name{font-size:16px;font-weight:700;text-align:center}
.skin-card .sk-badge{font-size:12px;font-weight:700;padding:1px 8px;border:2px solid #111;border-radius:6px;background:#ffe24a}
.skin-card .sk-badge.on{background:#4caf50;color:#fff}
#ultBtn{position:fixed;bottom:28px;right:28px;z-index:5;width:72px;height:72px;border-radius:50%;border:4px solid #111;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:none;box-shadow:3px 4px 0 #111;line-height:1.1;transition:opacity .2s}
#ultBtn.ready{animation:ultglow 1s ease-in-out infinite alternate;border-color:#ffd23f}
#ultBtn.cd{background:#555;opacity:.7}
@keyframes ultglow{from{box-shadow:3px 4px 0 #111,0 0 8px #ffd23f}to{box-shadow:3px 4px 0 #111,0 0 20px #ffd23f}}
#ultBtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #111}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn" class="btn">II</button>
<button id="ultBtn" onclick="useUlt()">궁극기</button>

<div id="lobby" class="overlay show">
  <div class="logo">찬찬특공개</div>
  <img id="titleDog" alt="">
  <p class="sub">좀비 고양이 왕을 물리쳐라!</p>
  <div class="lobby-grid">
    <button class="lobby-btn" onclick="goPage('shop')"><span class="lbi">🏪</span>상점</button>
    <button class="lobby-btn equip-btn" onclick="goPage('equip')"><span class="lbi">⚔️</span>장비</button>
    <button class="lobby-btn battle" onclick="goModeSelect()"><span class="lbi">💥</span>전투</button>
    <button class="lobby-btn" onclick="goPage('settings')"><span class="lbi">⚙️</span>메뉴</button>
  </div>
</div>

<div id="shopPage" class="subpage">
  <button class="back-link" onclick="goLobby()">← 뒤로</button>
  <div class="logo small">상점</div>
  <div class="shop-tabs">
    <button class="shop-tab locked" onclick="">장비</button>
    <button class="shop-tab" onclick="switchShopTab(1)">궁극기</button>
    <button class="shop-tab" onclick="switchShopTab(2)">동료</button>
    <button class="shop-tab" onclick="switchShopTab(3)">프로필</button>
    <button class="shop-tab" onclick="switchShopTab(4)">스킨</button>
  </div>
  <div id="shopContent" class="shop-content"></div>
</div>

<div id="equipPage" class="subpage">
  <button class="back-link" onclick="goLobby()">← 뒤로</button>
  <div class="logo small">장비</div>
  <div class="shop-tabs" id="equipTabs">
    <button class="shop-tab active" onclick="switchEquipTab(0)">장비</button>
    <button class="shop-tab" onclick="switchEquipTab(1)">판매</button>
    <button class="shop-tab" onclick="switchEquipTab(2)">동료</button>
  </div>
  <div id="equipContent" style="width:100%;max-width:500px;overflow-y:auto;flex:1"></div>
</div>

<div id="modeSelect" class="subpage">
  <button class="back-link" onclick="goLobby()">← 뒤로</button>
  <div class="logo small">전투</div>
  <div class="mode-grid">
    <button class="mode-card" onclick="goPage('battle')">
      <span class="mode-icon">📖</span>
      <span class="mode-name">일반 모드</span>
      <span class="mode-desc">스테이지를 클리어하며 진행</span>
    </button>
    <button class="mode-card infinite" onclick="startInfinite()">
      <span class="mode-icon">♾️</span>
      <span class="mode-name">무한 모드</span>
      <span class="mode-desc">끝없는 웨이브에서 살아남아라</span>
    </button>
  </div>
  <p id="infiniteBest" style="font-size:18px;color:#888"></p>
</div>

<div id="battlePage" class="subpage">
  <button class="back-link" onclick="goLobby()">← 뒤로</button>
  <div class="battle-content">
    <div class="stage-map-wrap" id="stageMapWrap">
      <div class="stage-map" id="stageMap"></div>
    </div>
    <div class="stage-info" id="stageInfo">
      <div class="si-num" id="siNum">STAGE 1</div>
      <div class="si-icon" id="siIcon">🌳</div>
      <div class="si-name" id="siName">동네 공원</div>
      <div class="si-lv" id="siLv">권장 Lv.1</div>
      <div class="si-stars" id="siStars">★</div>
      <button class="btn si-start" id="startBtn" disabled>준비 중...</button>
      <div class="si-nav">
        <button class="btn gray" onclick="moveStage(-1)" style="min-width:60px;padding:10px 16px;font-size:28px">◀</button>
        <button class="btn gray" onclick="moveStage(1)" style="min-width:60px;padding:10px 16px;font-size:28px">▶</button>
      </div>
      <p style="font-size:15px;color:#999;margin:0">드래그/WASD · 자동 공격</p>
    </div>
  </div>
</div>

<div id="settingsPage" class="subpage">
  <button class="back-link" onclick="goLobby()">← 뒤로</button>
  <div class="logo small">메뉴</div>
  <p class="coming">준비 중...</p>
</div>

<div id="levelup" class="overlay">
  <div class="logo small">레벨 업!</div>
  <div class="cards" id="cards"></div>
</div>

<div id="pause" class="overlay">
  <div class="logo small">일시정지</div>
  <button class="btn" id="resumeBtn">계속하기</button>
  <button class="btn gray" id="quitBtn">처음으로</button>
</div>

<div id="end" class="overlay">
  <div class="logo small" id="endTitle"></div>
  <img id="endDog" alt="">
  <div class="stats" id="endStats"></div>
  <button class="btn" id="retryBtn">다시 하기</button>
  <button class="btn gray" id="homeBtn">처음으로</button>

<script>
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('#game'),ctx=cv.getContext('2d');
let W,H,DPR,ZOOM;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ZOOM=clamp(Math.min(W,H)/620,.6,1.25)}
resize();addEventListener('resize',resize);

let sfxCtx;
function sfxInit(){if(!sfxCtx)sfxCtx=new(window.AudioContext||window.webkitAudioContext)();if(sfxCtx.state==='suspended')sfxCtx.resume();return sfxCtx}
function tone(f,d,t='sine',v=.12,fe){const c=sfxInit(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,c.currentTime);if(fe)o.frequency.exponentialRampToValueAtTime(fe,c.currentTime+d);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}
function noise(d,v=.08){const c=sfxInit(),n=c.sampleRate*d|0;if(n<1)return;const b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);s.connect(g);g.connect(c.destination);s.start()}
let _st={};function sfxT(k,fn,ms=60){const n=performance.now();if(n-(_st[k]||0)>ms){_st[k]=n;fn()}}
const sfx={
  click(){tone(880,.06,'square',.08)},
  shoot(){sfxT('sht',()=>tone(220,.07,'square',.05,120))},
  hit(){sfxT('hit',()=>tone(180,.05,'sine',.06,90))},
  kill(){tone(600,.12,'sine',.09,1100)},
  hurt(){tone(350,.18,'sawtooth',.08,120)},
  gem(){sfxT('gem',()=>tone(1100,.05,'sine',.05,1500),30)},
  explode(){noise(.2,.1);tone(70,.22,'sine',.09,25)},
  levelup(){tone(523,.1,'sine',.08);setTimeout(()=>tone(659,.1,'sine',.08),100);setTimeout(()=>tone(784,.14,'sine',.1),200)},
  boss(){tone(90,.4,'sawtooth',.09,50);setTimeout(()=>tone(70,.3,'sawtooth',.07,40),250)},
  bark(){noise(.05,.06);tone(280,.08,'square',.07,450)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16,'sine',.09),i*130))},
  lose(){[400,340,280,180].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.07,f*.6),i*180))},
};

/* ---------- 그림판 스타일 그리기 도구 ---------- */
function blobP(x,y,rx,ry,jit=.07,n=12){
  const p=[];for(let i=0;i<n;i++){const a=i/n*TAU,j=1+rnd(-jit,jit);p.push([x+Math.cos(a)*rx*j,y+Math.sin(a)*ry*j])}
  const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],path=new Path2D(),s=m(p[n-1],p[0]);
  path.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const q=m(p[i],p[(i+1)%n]);path.quadraticCurveTo(p[i][0],p[i][1],q[0],q[1])}
  path.closePath();return path;
}
function polyP(pts,jit=1.5){const p=new Path2D();pts.forEach((q,i)=>{const x=q[0]+rnd(-jit,jit),y=q[1]+rnd(-jit,jit);i?p.lineTo(x,y):p.moveTo(x,y)});p.closePath();return p}
function rectP(x,y,w,h,jit=1.2){return polyP([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],jit)}
function fs(c,p,fill,lw=3){if(fill){c.fillStyle=fill;c.fill(p)}if(lw){c.lineWidth=lw;c.strokeStyle='#111';c.stroke(p)}}
function fillOut(c,paths,fill,lw=3){c.lineWidth=lw*2;c.strokeStyle='#111';paths.forEach(p=>c.stroke(p));c.fillStyle=fill;paths.forEach(p=>c.fill(p))}
function line(c,x1,y1,x2,y2,lw=3,col='#111'){const mx=(x1+x2)/2+rnd(-1.5,1.5),my=(y1+y2)/2+rnd(-1.5,1.5);c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(mx,my,x2,y2);c.lineWidth=lw;c.strokeStyle=col;c.lineCap='round';c.stroke()}
function dot(c,x,y,r,col='#111'){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function sprite(w,h,fn){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);x.lineCap='round';x.lineJoin='round';fn(x,w,h);c.w=w;c.h=h;return c}
function frames(w,h,fn,k=2){return Array.from({length:k},()=>sprite(w,h,fn))}
function drawSpr(c,s,x,y,rot=0,sx=1,sy=1){c.save();c.translate(x,y);if(rot)c.rotate(rot);c.scale(sx,sy);c.drawImage(s,-s.w/2,-s.h/2,s.w,s.h);c.restore()}

const ART={};
ART.bone=(c,w,h,col='#f6f0dc')=>{const cx=w/2,cy=h/2,L=w*.27,r=w*.13;fillOut(c,[rectP(cx-L,cy-r*.6,L*2,r*1.2),blobP(cx-L,cy-r*.75,r,r),blobP(cx-L,cy+r*.75,r,r),blobP(cx+L,cy-r*.75,r,r),blobP(cx+L,cy+r*.75,r,r)],col,Math.max(1.5,w*.04))};
ART.gbone=(c,w,h)=>{ART.bone(c,w,h,'#ffd23f');line(c,w*.12,h*.12,w*.2,h*.2,2,'#f39c12');line(c,w*.85,h*.8,w*.92,h*.9,2,'#f39c12')};
ART.ball=(c,w,h,col='#d9ef3b',seam='#fff')=>{const cx=w/2,cy=h/2,r=w*.36;fs(c,blobP(cx,cy,r,r),col,Math.max(2,w*.05));c.strokeStyle=seam;c.lineWidth=Math.max(2,w*.05);c.beginPath();c.arc(cx-r*1.1,cy,r*.8,-.8,.8);c.stroke();c.beginPath();c.arc(cx+r*1.1,cy,r*.8,Math.PI-.8,Math.PI+.8);c.stroke()};
ART.fball=(c,w,h)=>{const cx=w/2,cy=h/2;fs(c,polyP([[cx-w*.3,cy],[cx-w*.48,cy-h*.3],[cx-w*.1,cy-h*.38],[cx,cy-h*.5],[cx+w*.15,cy-h*.36],[cx+w*.46,cy-h*.32],[cx+w*.3,cy]]),'#ff4d2e',2);ART.ball(c,w,h,'#ff9a1f','#ffe24a')};
function bubble(c,w,h,text,col){const cx=w/2,cy=h*.44;fs(c,polyP([[cx-w*.12,cy+h*.2],[cx-w*.28,cy+h*.46],[cx+w*.02,cy+h*.24]]),col,Math.max(2,w*.04));fs(c,blobP(cx,cy,w*.44,h*.33),col,Math.max(2,w*.04));c.font=`700 ${w*(text.length>2?.27:.36)}px Gaegu, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#111';c.fillText(text,cx,cy+1)}
ART.bark=(c,w,h)=>bubble(c,w,h,'멍!','#fff');
ART.howl=(c,w,h)=>bubble(c,w,h,'아우!','#c7dcff');
ART.poop=(c,w,h,col='#8a5a2b')=>{const cx=w/2,b=h*.9;fillOut(c,[blobP(cx,b-h*.14,w*.38,h*.14),blobP(cx,b-h*.34,w*.28,h*.12),blobP(cx,b-h*.52,w*.18,h*.1),polyP([[cx-w*.06,b-h*.58],[cx+w*.05,b-h*.78],[cx+w*.09,b-h*.56]],1)],col,Math.max(1.5,w*.04));dot(c,cx-w*.1,b-h*.35,Math.max(1.2,w*.035));dot(c,cx+w*.1,b-h*.35,Math.max(1.2,w*.035))};
ART.nuke=(c,w,h)=>{ART.poop(c,w,h,'#8fe03a');c.font=`700 ${w*.3}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#111';c.fillText('☢',w/2,h*.76)};

ART.storm=(c,w,h)=>{ART.zap(c,w,h,.6,w*.22,h*.4);fillOut(c,[blobP(w*.32,h*.35,w*.2,h*.16),blobP(w*.55,h*.27,w*.24,h*.2),blobP(w*.72,h*.38,w*.18,h*.14)],'#9aa3ad',Math.max(1.5,w*.035))};

function processImg(src){return new Promise((res,rej)=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{
  const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,w,h),a=d.data,M=5;
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(xx<M||xx>=w-M||y<M||y>=h-M)a[(y*w+xx)*4+3]=0;
  const white=i=>a[i*4+3]===0||(a[i*4]>210&&a[i*4+1]>210&&a[i*4+2]>210),seen=new Uint8Array(w*h),st=[];
  for(let xx=0;xx<w;xx++){st.push(xx,(h-1)*w+xx)}for(let y=0;y<h;y++){st.push(y*w,y*w+w-1)}
  while(st.length){const i=st.pop();if(seen[i])continue;seen[i]=1;if(!white(i))continue;a[i*4+3]=0;const px=i%w,py=(i/w)|0;
    if(px>0)st.push(i-1);if(px<w-1)st.push(i+1);if(py>0)st.push(i-w);if(py<h-1)st.push(i+w)}
  x.putImageData(d,0,0);
  let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(a[(y*w+xx)*4+3]>0){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<x0){res({cv:c,url:c.toDataURL()});return}
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,-x0,-y0);o.w=o.width;o.h=o.height;
  res({cv:o,url:o.toDataURL()})};im.src=src})}

/* ---------- 스폰 ---------- */
function spawnEnemy(type,x,y){const d=ENEMY[type],m=(1+G.t/90)*(G.stageMult||1);
  if(x===undefined){const a=Math.random()*TAU,R=viewR()+50;x=P.x+Math.cos(a)*R;y=P.y+Math.sin(a)*R}
  G.enemies.push({type,x,y,r:d.r,hp:d.hp*m,spd:d.spd*rnd(.9,1.1),dmg:d.dmg,xp:d.xp,kx:0,ky:0,flash:0,face:1,hb:{},spr:S[type],seed:(Math.random()*100)|0})}
function pickType(){const r=Math.random(),t=G.t;if(t>60&&r<.12)return'tank';if(t>25&&r<.38)return'runner';return'zombie'}
function spawnBoss(b){sfx.boss();G.arena={x:P.x,y:P.y,r:380,ang:0};G.banner={text:b.name+' 등장!',t:2.5};
  const e={type:'boss',boss:b,x:P.x,y:P.y-270,r:b.r,hp:b.hp,maxHp:b.hp,spd:b.spd,dmg:b.dmg,xp:0,kx:0,ky:0,flash:0,face:1,hb:{},spr:S[b.spr],seed:0,mode:'walk',tm:2.5,ft:3};
  G.enemies.push(e);G.boss=e}
function spawner(dt){
  if(G.infinite){
    G.waveT+=dt;
    const wm=1+G.wave*.35;G.stageMult=wm;
    if(!G.waveBoss){
      const rate=Math.min(1+G.wave*.3,8)*(G.arena?.2:1);G.spawnAcc+=rate*dt;
      while(G.spawnAcc>=1){G.spawnAcc--;if(G.enemies.length<200)spawnEnemy(pickType())}
      if(G.waveT>=15&&G.t>=G.nextWave&&!G.arena){G.nextWave=G.t+40;const n=Math.floor(10+G.wave*3),R=viewR()*.85;G.banner={text:'좀비 떼가 몰려온다!',t:1.8};
        for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(G.wave>3&&i%3===0?'runner':'zombie',P.x+Math.cos(a)*R,P.y+Math.sin(a)*R)}}
      if(G.waveT>=60){G.waveBoss=true;
        const hp=1500*Math.pow(1.5,G.wave-1),dmg=12+G.wave*3,spd=55+G.wave*2;
        const b={t:0,name:'WAVE '+G.wave+' 보스',hp,spr:G.wave%2===1?'boss1':'boss2',r:55+G.wave*2,spd,dmg,fish:G.wave>=3};
        spawnBoss(b)}}
    else if(!G.boss&&G.waveBoss){G.wave++;G.waveT=0;G.waveBoss=false;S.bg=S.stageBgs[(G.wave-1)%S.stageBgs.length];
      G.banner={text:'WAVE '+G.wave+' 시작!',t:2.5};P.hp=Math.min(P.maxHp,P.hp+30)}
    return}
  if(G.bossIdx<BOSSES.length&&G.t>=BOSSES[G.bossIdx].t&&!G.boss)spawnBoss(BOSSES[G.bossIdx++]);
  const rate=Math.min(.6+G.t/40,6)*(G.arena?.2:1);G.spawnAcc+=rate*dt;
  while(G.spawnAcc>=1){G.spawnAcc--;if(G.enemies.length<200)spawnEnemy(pickType())}
  if(G.t>=G.nextWave&&!G.arena){G.nextWave+=50;const n=Math.floor(12+G.t/15),R=viewR()*.85;G.banner={text:'좀비 떼가 몰려온다!',t:1.8};
    for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(G.t>120&&i%3===0?'runner':'zombie',P.x+Math.cos(a)*R,P.y+Math.sin(a)*R)}}
}
function bossAI(e,dt){e.tm-=dt;const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.mode==='walk'){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;e.face=dx>0?1:-1;if(e.tm<=0){e.mode='aim';e.tm=.7;e.dx=dx/d;e.dy=dy/d}}
  else if(e.mode==='aim'){if(e.tm<=0){e.mode='dash';e.tm=.55}}
  else{e.x+=e.dx*360*dt;e.y+=e.dy*360*dt;if(e.tm<=0){e.mode='walk';e.tm=rnd(2,3)}}
  if(e.boss.fish&&(e.ft-=dt)<=0){e.ft=3.6;const o=Math.random();for(let i=0;i<12;i++){const a=o+i*TAU/12;G.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,a,r:9,dmg:8,life:5})}}
  if(G.arena){const A=G.arena,ax=e.x-A.x,ay=e.y-A.y,ad=Math.hypot(ax,ay),lim=A.r-e.r;if(ad>lim){e.x=A.x+ax/ad*lim;e.y=A.y+ay/ad*lim}}}

/* ---------- 업데이트 ---------- */
function update(dt){
  G.t+=dt;
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l}
  else if(joy){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.hypot(dx,dy);if(d>6){const k=Math.min(1,d/40);mx=dx/d*k;my=dy/d*k}}
  const sp=P.speed*G.stats.spd;P.x+=mx*sp*dt;P.y+=my*sp*dt;P.moving=!!(mx||my);if(Math.abs(mx)>.1)P.face=mx>0?1:-1;if(P.moving)P.walk+=dt;
  if(G.arena){const A=G.arena,dx=P.x-A.x,dy=P.y-A.y,d=Math.hypot(dx,dy),lim=A.r-P.r-16;if(d>lim){P.x=A.x+dx/d*lim;P.y=A.y+dy/d*lim}A.ang+=dt*.6}
  P.inv-=dt;
  spawner(dt);
  const dec=Math.pow(.004,dt),far=viewR()+300;
  for(const e of G.enemies){
    if(e.boss)bossAI(e,dt);else{const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;e.face=dx>0?1:-1;
      if(d>far){const a=Math.random()*TAU,R=viewR()+40;e.x=P.x+Math.cos(a)*R;e.y=P.y+Math.sin(a)*R}}
    e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=dec;e.ky*=dec;e.flash-=dt}
  buildGrid();
  for(const e of G.enemies){if(e.boss)continue;query(e.x,e.y,e.r,o=>{if(o===e)return;const dx=e.x-o.x,dy=e.y-o.y,d2=dx*dx+dy*dy,m=e.r+o.r;
    if(d2<m*m&&d2>.01){const d=Math.sqrt(d2),f=(m-d)/d*.3;e.x+=dx*f;e.y+=dy*f}})}
  query(P.x,P.y,P.r,e=>{if((e.x-P.x)**2+(e.y-P.y)**2<(e.r+P.r-8)**2)hurt(e.dmg)});
  for(const w of G.weapons)WUP[w.id](w,dt);
  if(G.comp&&G.comp.alive){const C=G.comp,dx0=P.x-C.x,dy0=P.y-C.y,dist=Math.hypot(dx0,dy0);
    if(dist>60){const tx=P.x-50*P.face,ty=P.y+28,tdx=tx-C.x,tdy=ty-C.y,td=Math.hypot(tdx,tdy);
      const cs=Math.min(td,P.speed*G.stats.spd*.9*dt);C.x+=tdx/td*cs;C.y+=tdy/td*cs;C.moving=true;C.walk+=dt;if(Math.abs(tdx)>1)C.face=tdx>0?1:-1}else{C.moving=false;if(Math.abs(dx0)>1)C.face=dx0>0?-1:1}
    C.inv-=dt;
    C.weapons=[{id:'bone',lv:G.weapons[0]?G.weapons[0].lv:1,t:C.weapons[0]?C.weapons[0].t:0}];
    const ox=P.x,oy=P.y,of=P.face,od=G.stats.dmg,oa=G.stats.area,oc=G.stats.cd;
    P.x=C.x;P.y=C.y;P.face=C.face;G.stats.dmg*=.7;G.stats.area*=.7;
    for(const w of C.weapons)WUP[w.id](w,dt);
    P.x=ox;P.y=oy;P.face=of;G.stats.dmg=od;G.stats.area=oa;G.stats.cd=oc;
    query(C.x,C.y,16,e=>{if((e.x-C.x)**2+(e.y-C.y)**2<(e.r+16)**2&&C.inv<=0){C.hp-=e.dmg;C.inv=.8;if(C.hp<=0){C.hp=0;C.alive=false;G.fx.push({type:'poof',x:C.x,y:C.y,r:20,t:0,dur:.5})}}});
    for(const b of G.eproj){if(!b.dead&&(b.x-C.x)**2+(b.y-C.y)**2<(b.r+16)**2&&C.inv<=0){C.hp-=b.dmg;C.inv=.8;if(C.hp<=0){C.hp=0;C.alive=false;G.fx.push({type:'poof',x:C.x,y:C.y,r:20,t:0,dur:.5})}}}}
  for(const p of G.proj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*12;if((p.life-=dt)<=0){p.dead=true;continue}
    query(p.x,p.y,p.r,e=>{if(p.dead||p.hit.has(e))return;if((e.x-p.x)**2+(e.y-p.y)**2<(e.r+p.r)**2){p.hit.add(e);const l=Math.hypot(p.vx,p.vy);hit(e,p.dmg,p.vx/l*120,p.vy/l*120);if(--p.pierce<=0)p.dead=true}})}
  for(const m of G.mines){m.arm-=dt;m.life-=dt;let go=m.life<=0;
    if(!go&&m.arm<=0)query(m.x,m.y,16,e=>{if(!go&&(e.x-m.x)**2+(e.y-m.y)**2<(e.r+14)**2)go=true});
    if(go){m.dead=true;explode(m.x,m.y,m.R,m.d,m.nuke)}}
  for(const b of G.eproj){b.x+=b.vx*dt;b.y+=b.vy*dt;if((b.life-=dt)<=0)b.dead=true;else if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+P.r)**2){b.dead=true;hurt(b.dmg)}}
  const mg=G.stats.magnet;
  for(const g of G.gems){const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);if(d<P.r+8){g.dead=true;sfx.gem();gainXp(g.v);continue}
    if(g.pull||d<mg){g.pull=true;g.sp+=1100*dt;const s=Math.max(150,g.sp)*dt;g.x+=dx/d*s;g.y+=dy/d*s}}
  for(const it of G.items){if((it.x-P.x)**2+(it.y-P.y)**2<(P.r+16)**2){it.dead=true;
    if(it.type==='equip'){eqInv.push(it.equipId);saveEquip();G.banner={text:EQUIPS[it.equipId].icon+' '+EQUIPS[it.equipId].name+' 획득!',t:2};G.texts.push({x:P.x,y:P.y-40,v:EQUIPS[it.equipId].name,t:0,heal:true})}
    else if(it.type==='meat'){P.hp=Math.min(P.maxHp,P.hp+30);G.texts.push({x:P.x,y:P.y-40,v:'+30',t:0,heal:true})}else for(const g of G.gems)g.pull=true}}
  for(const f of G.fx)if((f.t+=dt)>f.dur)f.dead=true;
  for(const t of G.texts){t.t+=dt;t.y-=35*dt;if(t.t>.6)t.dead=true}
  G.shake=Math.max(0,G.shake-dt*30);if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  for(const k of['enemies','proj','eproj','gems','items','fx','texts','mines'])G[k]=G[k].filter(o=>!o.dead);
  G.ultCd=Math.max(0,G.ultCd-dt);
  if(G.winT>0&&(G.winT-=dt)<=0){endGame(true);return}
  if(G.pendingLv>0&&G.state==='play')openLevelUp();
  if(equippedUlt)updateUltBtn();
}

    const chw=30;ctx.fillStyle='#fff';ctx.fillRect(C.x-chw/2,C.y+22,chw,5);ctx.fillStyle='#74b9ff';ctx.fillRect(C.x-chw/2,C.y+22,chw*C.hp/C.maxHp,5);ctx.lineWidth=1.5;ctx.strokeStyle='#111';ctx.strokeRect(C.x-chw/2,C.y+22,chw,5)}
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(P.x,P.y+28,22,7,0,0,TAU);ctx.fill();
  if(!(P.inv>0&&Math.floor(now*20)%2)){const bob=P.moving?Math.abs(Math.sin(P.walk*10))*5:0,sq=P.moving?1+Math.sin(P.walk*20)*.03:1+Math.sin(now*3)*.02,s=66/dog.h;
    ctx.save();ctx.translate(P.x,P.y-4-bob);ctx.rotate(P.moving?Math.sin(P.walk*10)*.06:0);ctx.scale(P.face*s,s*sq);ctx.drawImage(dog,-dog.w/2,-dog.h/2);ctx.restore()}
  const hpw=46;ctx.fillStyle='#fff';ctx.fillRect(P.x-hpw/2,P.y+36,hpw,7);ctx.fillStyle='#e74c3c';ctx.fillRect(P.x-hpw/2,P.y+36,hpw*P.hp/P.maxHp,7);ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.strokeRect(P.x-hpw/2,P.y+36,hpw,7);
  for(const w of G.weapons)if(w.balls){const spr=S.proj[w.id];for(const b of w.balls)drawSpr(ctx,spr,b[0],b[1],now*8,b[2]/13*.95,b[2]/13*.95)}
  if(G.comp&&G.comp.alive)for(const w of G.comp.weapons)if(w.balls){const spr=S.proj[w.id];for(const b of w.balls)drawSpr(ctx,spr,b[0],b[1],now*8,b[2]/13*.65,b[2]/13*.65)}
  for(const p of G.proj)if(vis(p.x,p.y,20))drawSpr(ctx,S.proj[p.spr],p.x,p.y,p.rot,p.r/13,p.r/13);

  for(const f of G.fx){const k=f.t/f.dur;
    if(f.type==='ring'){ctx.globalAlpha=1-k;ctx.lineWidth=f.big?6:4;ctx.strokeStyle='#111';const r=f.r*(.3+.7*k);ctx.stroke(blobP(f.x,f.y,r,r,.05,16));if(f.big){ctx.strokeStyle='#7aa7ff';ctx.lineWidth=3;ctx.stroke(blobP(f.x,f.y,r*.9,r*.9,.06,16))}ctx.globalAlpha=1}
    else if(f.type==='boom'){ctx.globalAlpha=(1-k)*.85;const r=f.r*(.5+.5*k);fs(ctx,blobP(f.x,f.y,r,r,.15,14),f.col,4);ctx.globalAlpha=1}
    else if(f.type==='poof'){ctx.strokeStyle='#111';ctx.lineWidth=2.5;ctx.globalAlpha=1-k;for(let i=0;i<6;i++){const a=i/6*TAU+f.r,r0=f.r*(.6+k),r1=f.r*(.9+k*1.4);ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*r0,f.y+Math.sin(a)*r0);ctx.lineTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1);ctx.stroke()}ctx.globalAlpha=1}

      for(const [lw,col] of[[9,'#111'],[4,'#ffe24a']]){ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}

function hud(now){

/* ---------- 레벨업 ---------- */
function choices(){
  const evo=[],pool=[];
  for(const w of G.weapons){const d=WEAPONS[w.id];if(d.evo&&w.lv>=MAX_LV&&G.passives.some(p=>p.id===d.pair))evo.push({kind:'evo',id:w.id})}
  for(const id in WEAPONS){const d=WEAPONS[id];if(d.evolved)continue;const own=G.weapons.find(w=>w.id===id||w.id===d.evo);
    if(!own)pool.push({kind:'w',id,lv:0});else if(own.id===id&&own.lv<MAX_LV)pool.push({kind:'w',id,lv:own.lv})}
  for(const id in PASSIVES){const own=G.passives.find(p=>p.id===id);if(!own)pool.push({kind:'p',id,lv:0});else if(own.lv<MAX_LV)pool.push({kind:'p',id,lv:own.lv})}
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
  const out=[...evo,...pool].slice(0,3);return out.length?out:[{kind:'heal'}];
}
function cardInfo(c){
  if(c.kind==='evo'){const e=WEAPONS[WEAPONS[c.id].evo];return{icon:WEAPONS[c.id].evo,name:e.name,tag:'진화!',cls:'evo',desc:e.desc}}
  if(c.kind==='w'){const d=WEAPONS[c.id];return{icon:c.id,name:d.name,tag:c.lv?`Lv.${c.lv} → ${c.lv+1}`:'NEW!',cls:c.lv?'':'new',desc:c.lv?'더 강해진다! (피해량·개수 증가)':d.desc}}
  if(c.kind==='p'){const d=PASSIVES[c.id];return{icon:c.id,name:d.name,tag:c.lv?`Lv.${c.lv} → ${c.lv+1}`:'NEW!',cls:c.lv?'':'new',desc:d.desc+`<br><small>진화: ${PAIR_OF[c.id]||'-'}</small>`}}
  return{icon:'meat',name:'맛있는 고기',tag:'회복',cls:'',desc:'체력을 50 회복한다'};
}
function openLevelUp(){G.state='levelup';sfx.levelup();joy=null;const box=$('#cards');box.innerHTML='';box.classList.remove('ready');
  for(const c of choices()){const i=cardInfo(c),d=document.createElement('div');d.className='card';d.style.setProperty('--r',rnd(-2.5,2.5)+'deg');
    d.innerHTML=`<img src="${S.iconURL[i.icon]}" alt=""><div class="nm">${i.name}</div><div><span class="tag ${i.cls}">${i.tag}</span></div><div class="ds">${i.desc}</div>`;
    d.onclick=()=>pick(c);box.appendChild(d)}
  $('#levelup').classList.add('show');setTimeout(()=>box.classList.add('ready'),350)}
function pick(c){sfx.click();
  if(c.kind==='evo'){const w=G.weapons.find(w=>w.id===c.id);w.id=WEAPONS[c.id].evo;w.t=0;w.balls=null;G.banner={text:WEAPONS[w.id].name+' 진화!',t:2}}
  else if(c.kind==='w'){const w=G.weapons.find(w=>w.id===c.id);if(w)w.lv++;else G.weapons.push({id:c.id,lv:1,t:0})}
  else if(c.kind==='p'){let p=G.passives.find(p=>p.id===c.id);if(p)p.lv++;else G.passives.push(p={id:c.id,lv:1});PASSIVES[c.id].apply(G.stats,P)}
  else P.hp=Math.min(P.maxHp,P.hp+50);
  G.pendingLv--;$('#levelup').classList.remove('show');
  if(G.pendingLv>0)openLevelUp();else G.state='play';
}

/* ---------- 궁극기 ---------- */
function useUlt(){
  if(!G||G.state!=='play'||!equippedUlt)return;
  const u=ULTIMATES[equippedUlt];
  if(G.ultCd>0||G.ultPts<u.pts)return;
  G.ultPts=0;G.ultCd=u.cd;
  if(equippedUlt==='jump')startJumpUlt();
  else if(equippedUlt==='orbital')startOrbitalUlt();
}
function startJumpUlt(){
  G.ultState='jump_up';G.ultT=0;G.ultX=P.x;G.ultY=P.y;G.state='ult';sfx.boss();
}
function startOrbitalUlt(){
  G.ultState='orb_zoom';G.ultT=0;G.ultX=P.x;G.ultY=P.y;G.state='ult';
}
function updateUlt(dt){
  G.ultT+=dt;G.ultCd=Math.max(0,G.ultCd-dt);G.shake=Math.max(0,G.shake-dt*30);
  if(G.ultState==='jump_up'){
    if(G.ultT>=.6){G.ultState='jump_down';G.ultT=0}}
  else if(G.ultState==='jump_down'){
    if(G.ultT>=.4){G.ultState='jump_land';G.ultT=0;sfx.explode();G.shake=20;
      const R=250*G.stats.area;
      query(P.x,P.y,R,e=>{const dx=e.x-P.x,dy=e.y-P.y,dd=Math.hypot(dx,dy)||1;if(dd<R+e.r){hit(e,e.hp+100,dx/dd*400,dy/dd*400)}});
      G.fx.push({type:'boom',x:P.x,y:P.y,r:R,t:0,dur:.5,col:'#ffd23f'})}}
  else if(G.ultState==='jump_land'){
    if(G.ultT>=.5){G.ultState=null;G.state='play'}}
  else if(G.ultState==='orb_zoom'){
    if(G.ultT>=1.5){G.ultState='orb_sky';G.ultT=0}}
  else if(G.ultState==='orb_sky'){
    if(G.ultT>=2){G.ultState='orb_fire';G.ultT=0;sfx.boss();sfx.explode()}}
  else if(G.ultState==='orb_fire'){
    if(G.ultT<.1){const R=320*G.stats.area;
      query(P.x,P.y,R+100,e=>{const dx=e.x-P.x,dy=e.y-P.y,dd=Math.hypot(dx,dy)||1;
        if(dd>60&&dd<R+e.r)hit(e,e.hp+200,dx/dd*500,dy/dd*500)});
      G.shake=25}
    if(G.ultT>=2){G.ultState='orb_end';G.ultT=0}}
  else if(G.ultState==='orb_end'){
    if(G.ultT>=.8){G.ultState=null;G.state='play'}}
}
function ultBg(cx,cy,hw,hh){if(S.bg){ctx.fillStyle=S.bg;ctx.fillRect(cx-hw,cy-hh,hw*2,hh*2)}else{ctx.fillStyle='#fbfaf3';ctx.fillRect(cx-hw,cy-hh,hw*2,hh*2)}}
function ultDog(){if(!dog)return;const s=66/dog.h;ctx.save();ctx.translate(P.x,P.y);ctx.scale(P.face*s,s);ctx.drawImage(dog,-dog.w/2,-dog.h/2);ctx.restore()}
function renderUlt(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cx=G.ultX,cy=G.ultY,hw=W/2/ZOOM+20,hh=H/2/ZOOM+20;
  if(G.ultState==='jump_up'){
    const k=G.ultT/.6;
    ctx.fillStyle='#fbfaf3';ctx.fillRect(0,0,W,H);
    const z=ZOOM*(1+k*.5);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);
    if(dog){const s=66/dog.h,yOff=-k*200;ctx.save();ctx.translate(P.x,P.y+yOff);ctx.scale(P.face*s,s);ctx.drawImage(dog,-dog.w/2,-dog.h/2);ctx.restore()}}
  else if(G.ultState==='jump_down'){
    const k=G.ultT/.4;
    ctx.fillStyle='#fbfaf3';ctx.fillRect(0,0,W,H);
    const z=ZOOM*(1.5-k*.5);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);
    if(dog){const s=66/dog.h,yOff=-200*(1-k*k);ctx.save();ctx.translate(P.x,P.y+yOff);ctx.scale(P.face*s*(1+k*.3),s*(1+k*.3));ctx.drawImage(dog,-dog.w/2,-dog.h/2);ctx.restore()}
    for(let i=0;i<6;i++){const a=i/6*TAU,r=40*k;ctx.strokeStyle='rgba(255,210,60,'+(1-k)+')';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(P.x+Math.cos(a)*r,P.y+Math.sin(a)*r);ctx.lineTo(P.x+Math.cos(a)*(r+60),P.y+Math.sin(a)*(r+60));ctx.stroke()}}
  else if(G.ultState==='jump_land'){
    const k=Math.min(1,G.ultT/.5);
    ctx.translate(W/2+rnd(-G.shake,G.shake),H/2+rnd(-G.shake,G.shake));ctx.scale(ZOOM,ZOOM);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);ultDog();
    ctx.globalAlpha=(1-k)*.6;const R=250*G.stats.area*k;ctx.strokeStyle='#ffd23f';ctx.lineWidth=12;ctx.beginPath();ctx.arc(P.x,P.y,R,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  else if(G.ultState==='orb_zoom'){
    const k=Math.min(1,G.ultT/1.5);
    ctx.fillStyle='#fbfaf3';ctx.fillRect(0,0,W,H);
    const z=ZOOM*(1+k*.8);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);ultDog();
    if(k>.6){ctx.setTransform(DPR,0,0,DPR,0,0);const bx=W/2,by=H*.32,bw=240,bh=52,br=14,tail=18;ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(bx-bw/2+br,by-bh/2);ctx.lineTo(bx+bw/2-br,by-bh/2);ctx.quadraticCurveTo(bx+bw/2,by-bh/2,bx+bw/2,by-bh/2+br);ctx.lineTo(bx+bw/2,by+bh/2-br);ctx.quadraticCurveTo(bx+bw/2,by+bh/2,bx+bw/2-br,by+bh/2);ctx.lineTo(bx+12,by+bh/2);ctx.lineTo(bx,by+bh/2+tail);ctx.lineTo(bx-12,by+bh/2);ctx.lineTo(bx-bw/2+br,by+bh/2);ctx.quadraticCurveTo(bx-bw/2,by+bh/2,bx-bw/2,by+bh/2-br);ctx.lineTo(bx-bw/2,by-bh/2+br);ctx.quadraticCurveTo(bx-bw/2,by-bh/2,bx-bw/2+br,by-bh/2);ctx.closePath();ctx.fill();ctx.stroke();txt('하늘이 열린다!!',bx,by,34,'center','#c0392b')}}
  else if(G.ultState==='orb_sky'){
    const k=G.ultT/2;
    const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#1a1a4e');grd.addColorStop(.5,'#2d3a8c');grd.addColorStop(1,'#74b9ff');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    for(let i=0;i<20;i++){ctx.fillStyle='rgba(255,255,255,'+(Math.sin(now*3+i)*.3+.4)+')';ctx.beginPath();ctx.arc((i*137.5)%W,(i*89.3)%H,1.5,0,TAU);ctx.fill()}
    if(k>.5){const lk=(k-.5)*2;ctx.globalAlpha=lk;
      ctx.fillStyle='rgba(230,40,40,.15)';ctx.fillRect(0,0,W,H);
      for(let i=0;i<5;i++){ctx.strokeStyle='rgba(255,60,60,'+(lk*.6)+')';ctx.lineWidth=3+i*2;ctx.beginPath();ctx.moveTo(W/2+rnd(-40,40),0);ctx.lineTo(W/2+rnd(-20,20),H);ctx.stroke()}
      ctx.globalAlpha=1}}
  else if(G.ultState==='orb_fire'){
    const k=G.ultT/2;
    ctx.fillStyle='#fbfaf3';ctx.fillRect(0,0,W,H);
    ctx.translate(W/2+rnd(-G.shake,G.shake),H/2+rnd(-G.shake,G.shake));ctx.scale(ZOOM,ZOOM);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);
    const R=320*G.stats.area;
    ctx.globalAlpha=Math.max(0,(1-k)*.7);
    for(let i=0;i<8;i++){const rr=R*(0.3+k*.7),a=i/8*TAU+now*2;
      ctx.strokeStyle=i%2?'#ff3333':'#ff8800';ctx.lineWidth=20-k*12;ctx.beginPath();ctx.arc(P.x,P.y,rr,a,a+.5);ctx.stroke()}
    const beamW=60*(1-k*.5);ctx.fillStyle='rgba(255,60,60,'+(1-k)*.8+')';ctx.fillRect(P.x-beamW/2,cy-hh,beamW,hh*2);
    ctx.strokeStyle='rgba(255,200,60,'+(1-k)+')';ctx.lineWidth=8;ctx.beginPath();ctx.arc(P.x,P.y,60,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;ultDog();
    ctx.fillStyle='rgba(0,0,0,'+(1-k)*.3+')';ctx.fillRect(cx-hw,cy-hh,hw*2,hh*2)}
  else if(G.ultState==='orb_end'){
    const k=G.ultT/.8;
    ctx.fillStyle='#fbfaf3';ctx.fillRect(0,0,W,H);
    ctx.translate(W/2,H/2);ctx.scale(ZOOM,ZOOM);ctx.translate(-cx,-cy);
    ultBg(cx,cy,hw,hh);ultDog();
    ctx.globalAlpha=(1-k)*.4;ctx.fillStyle='#333';ctx.beginPath();ctx.arc(P.x,P.y,320*G.stats.area*(.5+k*.5),0,TAU);ctx.fill();ctx.globalAlpha=1}
}

function buildStageMap(){
  const map=$('#stageMap');map.innerHTML='';
  const svgNS='http://www.w3.org/2000/svg',svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('width','1300');svg.setAttribute('height','660');
  svg.style.cssText='position:absolute;inset:0;pointer-events:none';
  for(let i=0;i<STAGES.length-1;i++){
    const a=STAGES[i],b=STAGES[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2+(i%2===0?-30:30);
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('d','M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y);
    p.setAttribute('stroke',i+1<stageProgress?'#8fcf5a':'#ccc');
    p.setAttribute('stroke-width','5');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');
    svg.appendChild(p);
  }
  map.appendChild(svg);
  STAGES.forEach((s,i)=>{
    const node=document.createElement('div');
    node.className='stage-node';
    node.style.left=s.x+'px';node.style.top=s.y+'px';
    if(i+1<stageProgress){node.classList.add('cleared');node.style.background='#d5f5d0';node.style.borderColor='#4a8c2a';
      node.innerHTML='<div class="st-check">✓</div><div class="st-num">STAGE '+s.id+'</div><div class="st-icon">'+s.icon+'</div><div class="st-name">'+s.name+'</div><div class="st-lv">Lv.'+s.lv+'</div>'}
    else if(i+1<=stageProgress){node.style.background=s.bg;
      node.innerHTML='<div class="st-num">STAGE '+s.id+'</div><div class="st-icon">'+s.icon+'</div><div class="st-name">'+s.name+'</div><div class="st-lv">Lv.'+s.lv+'</div>'}
    else{node.classList.add('locked');node.style.background='#ddd';
      node.innerHTML='<div class="st-num">STAGE '+s.id+'</div><div class="st-icon">🔒</div><div class="st-name">???</div><div class="st-lv">???</div>'}
    if(i+1===selectedStage)node.classList.add('current');
    node.onclick=()=>{if(i+1<=stageProgress)selectStage(i+1)};
    map.appendChild(node);
  });
  const di=document.createElement('img');di.id='stageDog';di.className='stage-dog';
  di.src=dogURL;di.style.width='50px';di.style.height='auto';
  const cs=STAGES[selectedStage-1];
  di.style.left=cs.x+'px';di.style.top=(cs.y-52)+'px';
  map.appendChild(di);
  updateStageInfo();
}

function buyBorder(id){const b=BORDERS.find(x=>x.id===id);if(!b||gold<b.price)return;sfx.click();gold-=b.price;ownedBorders.push(id);saveGold();saveBorders();selectBorder(id)}
function selectBorder(id){sfx.click();equippedBorder=id;saveBorders();switchShopTab(3)}
function promptNickname(){const d=document.createElement('div');d.id='nickModal';d.style.cssText='position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)';
  d.innerHTML='<div style="background:#fff;border:4px solid #111;border-radius:20px;padding:28px;max-width:340px;width:90%;text-align:center;box-shadow:6px 7px 0 #111"><div style="font-size:28px;font-weight:700;margin-bottom:6px">닉네임 설정</div><div style="font-size:16px;color:#e74c3c;margin-bottom:14px">한번 정하면 바꿀 수 없습니다!</div><input id="nickInput" style="font-family:inherit;font-size:22px;padding:8px 14px;border:3px solid #111;border-radius:10px;width:100%;text-align:center;box-sizing:border-box" maxlength="12" placeholder="닉네임 입력"><div style="margin-top:14px"><button class="btn" style="font-size:22px;min-width:120px" onclick="confirmNick()">확인</button></div></div>';
  document.body.appendChild(d);setTimeout(()=>$('#nickInput').focus(),100)}
function confirmNick(){const v=$('#nickInput').value.trim();if(!v)return;playerName=v;localStorage.setItem('ccsg_name',playerName);const m=$('#nickModal');if(m)m.remove()}

const show=(id,on)=>$(id).classList.toggle('show',on);
const allScreens=['#lobby','#battlePage','#shopPage','#equipPage','#settingsPage','#modeSelect','#end','#pause','#levelup'];
function goPage(id){sfx.click();show('#lobby',false);show('#modeSelect',false);show('#'+id+'Page',true);if(id==='battle'){buildStageMap();setTimeout(()=>scrollToStage(selectedStage),50)}else if(id==='equip')buildEquipPage();else if(id==='shop')buildShopPage()}
function goModeSelect(){sfx.click();show('#lobby',false);show('#modeSelect',true);const b=parseInt(localStorage.getItem('ccsg_infbest')||'0');$('#infiniteBest').textContent=b?'최고 기록: WAVE '+b:''}
function goLobby(){sfx.click();['#shopPage','#equipPage','#battlePage','#settingsPage','#modeSelect'].forEach(id=>show(id,false));show('#lobby',true)}
let lastInfinite=false;
function start(){sfx.click();lastInfinite=false;newGame();allScreens.forEach(id=>show(id,false));$('#pauseBtn').style.display='block'}
function startInfinite(){sfx.click();lastInfinite=true;newGame(true);allScreens.forEach(id=>show(id,false));$('#pauseBtn').style.display='block'}
function retry(){sfx.click();if(lastInfinite)newGame(true);else newGame();allScreens.forEach(id=>show(id,false));$('#pauseBtn').style.display='block'}
function pause(){if(G&&G.state==='play'){G.state='pause';joy=null;show('#pause',true)}}
function resume(){if(G&&G.state==='pause'){G.state='play';show('#pause',false)}}
function home(){sfx.click();G=null;['#end','#pause','#levelup','#battlePage'].forEach(id=>show(id,false));show('#lobby',true);$('#pauseBtn').style.display='none';$('#ultBtn').style.display='none'}
function endGame(win){G.state='over';joy=null;$('#pauseBtn').style.display='none';
  if(G.infinite){sfx.lose();const best=parseInt(localStorage.getItem('ccsg_infbest')||'0');
    if(G.wave>best)localStorage.setItem('ccsg_infbest',String(G.wave));
    $('#endTitle').textContent='WAVE '+G.wave+' 탈락!';$('#endDog').src=dogURL;$('#endDog').className='lose';
    $('#endStats').innerHTML=`<b>무한 모드</b><br>도달 웨이브 <b>WAVE ${G.wave}</b><br>생존 시간 <b>${fmt(G.t)}</b><br>처치한 좀비 <b>${G.kills}</b><br>도달 레벨 <b>${G.lv}</b>${G.wave>best?'<br><b style="color:#e74c3c">🎉 신기록!</b>':''}`;
    show('#end',true);return}
  if(win){sfx.win();if(selectedStage>=stageProgress&&selectedStage<STAGES.length){stageProgress=selectedStage+1;localStorage.setItem('ccsg_stage',String(stageProgress));selectedStage=stageProgress}}else sfx.lose();
  $('#endTitle').textContent=win?'승리! 멍멍!':'끄앙... 쓰러졌다';$('#endDog').src=dogURL;$('#endDog').className=win?'':'lose';
  const sn=STAGES[Math.min(selectedStage,STAGES.length)-1].name;
  $('#endStats').innerHTML=`<b>${sn}</b><br>생존 시간 <b>${fmt(G.t)}</b><br>처치한 좀비 <b>${G.kills}</b><br>도달 레벨 <b>${G.lv}</b>`;show('#end',true)}
$('#startBtn').onclick=start;$('#retryBtn').onclick=retry;$('#homeBtn').onclick=home;$('#quitBtn').onclick=home;
$('#resumeBtn').onclick=resume;$('#pauseBtn').onclick=pause;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape'||e.code==='KeyP'){if(G&&G.state==='play')pause();else resume()}if(e.code==='KeyX')useUlt()});
addEventListener('keyup',e=>{keys[e.code]=false});
let _cheat='',_enterCnt=0;addEventListener('keydown',e=>{if(e.code==='Enter'){_enterCnt++;_cheat=''}else{if(e.key.length===1)_cheat+=e.key;if(_enterCnt>=2&&_cheat==='rladncks'){_enterCnt=0;_cheat='';gold=99999;saveGold();stageProgress=STAGES.length;localStorage.setItem('ccsg_stage',String(stageProgress));ownedSkins=SKINS.map(s=>s.id);saveSkins();ownedUlts=Object.keys(ULTIMATES);saveUlts();ownedCompanions=Object.keys(COMPANIONS);equippedCompanion='chanchan';saveCompanions();ownedBorders=BORDERS.map(b=>b.id);equippedBorder='legendary';saveBorders();alert('관리자 모드: 전체 해금 완료')}}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
cv.addEventListener('pointerdown',e=>{if(!G||G.state!=='play')return;joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}});
const up=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

let last=performance.now(),clock=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;clock+=dt;if(G&&G.state==='play')update(dt);if(G&&G.state==='ult')updateUlt(dt);if(dog){try{if(G&&G.state==='ult')renderUlt(clock);else render(clock)}catch(err){console.error(err);if(G&&G.state==='ult'){G.ultState=null;G.state='play'}}}requestAnimationFrame(loop)}
const fontReady=Promise.race([document.fonts.load('700 20px Gaegu'),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
Promise.all([fontReady,loadDog(),loadAllSkins()]).then(()=>{buildSprites();$('#titleDog').src=dogURL;const b=$('#startBtn');b.disabled=false;b.textContent='게임 시작';requestAnimationFrame(loop);if(!playerName)promptNickname()});
</script>
</body>
</html>
